spring:
  application:
    name: haypacomer
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:haypacomer}}
    username: ${POSTGRES_USER:haypacomer}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 5MB

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    commit: ${RENDER_GIT_COMMIT:local}
    name: HayPaComer
    description: Smart fridge with live inventory, cook-now, and cold chain

haypacomer:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: https://api.haypacomer.dev
      access-token-time-to-live: 15m
  mail:
    base-url: ${PUBLIC_BASE_URL:https://haypacomer.dev}
    log-links: ${MAIL_LOG_LINKS:false}
  notifications:
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
  ai:
    provider: ${AI_PROVIDER:offline}
    timeout: 10s
    cache-time-to-live: 1h
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}
    openai-compatible:
      base-url: ${OPENAI_COMPATIBLE_BASE_URL:}
      api-key: ${OPENAI_COMPATIBLE_API_KEY:}
      model: ${OPENAI_COMPATIBLE_MODEL:gpt-4o-mini}
