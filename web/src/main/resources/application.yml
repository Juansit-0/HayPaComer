spring:
  application:
    name: haypacomer
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:haypacomer}}
    username: ${POSTGRES_USER:haypacomer}
    password: ${POSTGRES_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: HayPaComer
    description: Smart fridge with live inventory, cook-now, and cold chain

haypacomer:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: https://api.haypacomer.dev
      access-token-time-to-live: 15m
  mail:
    base-url: ${PUBLIC_BASE_URL:https://haypacomer.dev}
    log-links: ${MAIL_LOG_LINKS:false}
  notifications:
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:}
