name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test
        run: mvn -B -ntp verify

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the production image
        run: docker build --tag haypacomer:${{ github.sha }} .

      - name: Check the image runs as a non-root user
        run: test "$(docker image inspect --format '{{.Config.User}}' haypacomer:${{ github.sha }})" = "haypacomer"

  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compile ESP32 sketches
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: |
            - name: OneWire
            - name: DallasTemperature
            - name: ArduinoJson
            - name: HX711
          sketch-paths: |
            - firmware/esp32/door_temp
            - firmware/esp32/scale
